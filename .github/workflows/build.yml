name: Build Linux AppImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build-appimage:
    # Используем ubuntu-22.04 (ubuntu-20.04 удалён из GitHub Runners в 2025)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pandas numpy matplotlib pyinstaller
          # Если у тебя есть requirements.txt — раскомментируй:
          # pip install -r requirements.txt

      - name: Build with PyInstaller
        # --onedir надёжнее для GUI, чем --onefile
        run: |
          pyinstaller --onedir --windowed --name Analizator main.py

      - name: Setup AppImage structure
        run: |
          # Создаём структуру AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Копируем всё из dist/Analizator в AppDir/usr/bin
          cp -r dist/Analizator/* AppDir/usr/bin/

          # Создаём .desktop файл
          cat > AppDir/usr/share/applications/analizator.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Analizator
          Comment=Signal Quality Analyzer
          Exec=analizator
          Icon=analizator
          Terminal=false
          Categories=Utility;
          EOF

          # ВАЖНО: копируем .desktop в корень AppDir (требование appimagetool)
          cp AppDir/usr/share/applications/analizator.desktop AppDir/

          # Создаём скрипт AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/_internal:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/Analizator" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage AppDir Analizator.AppImage --no-appstream

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Analizator-AppImage
          path: Analizator.AppImage